<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Record Manager - Modern academic tracking and record management dashboard.">
  <title>Student Record Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header Section -->
    <header class="app-header" id="mainHeader">
      <div class="brand-section">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 14l9-5-9-5-9 5 9 5z" />
            <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
            <path d="M12 14v7" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Student Record Manager</h1>
          <p class="brand-subtitle">Academic Performance & Records Directory</p>
        </div>
      </div>
      <div class="header-badges">
        <div class="status-chip" id="systemStatus">
          <span class="status-dot"></span>
          <span>Data Model Active</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="mainContent">
      <div class="overview-bar">
        <h2 class="overview-title">Enrolled Students</h2>
        <div class="student-count" id="studentCounter">
          Displaying <strong>10</strong> records
        </div>
      </div>

      <!-- Students Card Grid -->
      <section class="student-grid" id="studentGrid" aria-label="Student records list">
        <!-- Rendered dynamically by app.js -->
      </section>
    </main>
  </div>

  <!-- Application Script -->
  <script type="module" src="app.js"></script>
</body>
</html>
